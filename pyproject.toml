[project]
name = "Drop Multiplier"
version = "1.2"
authors = [{ name = "youdietoo" }]
description = """\
Adds configurable loot drop multiplication with asynchronous processing.
Lower Async drop processing if experiencing crashes.

Features:
- Multiplies enemy loot drops
- Process additional loot rolls in the same tick

Original by: juso
"""

[tool.sdkmod]
name = "Drop Multiplier"
license = {name = "MIT", url = "https://choosealicense.com/licenses/mit/" }
coop_support = "Yes"
